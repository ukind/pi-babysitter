name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quoted on purpose: YAML types bare scalars (24 -> integer, 22.19 ->
        # float), and node versions must reach setup-node as strings.
        # 22.19.0 floor: @earendil-works/pi-agent-core@1.5.0 requires >=22.19.0
        # (F020 follow-up: the 1.5.0 lockfile cannot install on 22.6).
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm ci, not install: the lockfile is the contract (F012).
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      # FR9: the eval score gate. A failing score fails the job: the runner sets
      # process.exitCode when any fixture errors or any score misses.
      - run: npm run eval
